<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magma Autospa — Clickthrough Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#0d1013;
  --bg-app:#0f1216;
  --panel:#171c22;
  --panel-2:#1d232b;
  --panel-3:#242b34;
  --glass-border:rgba(255,255,255,0.08);
  --glass-border-strong:rgba(255,255,255,0.14);
  --text-hi:#eef1f4;
  --text-mid:#aab2bd;
  --text-dim:#6b7280;
  --teal:#49d9c4;
  --teal-dim:rgba(73,217,196,0.16);
  --amber:#f0a93c;
  --amber-dim:rgba(240,169,60,0.16);
  --danger:#e5626a;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(circle at 15% -10%, rgba(73,217,196,0.07), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(240,169,60,0.05), transparent 40%),
    var(--bg-base);
  color:var(--text-hi);
  min-height:100vh;
  padding-bottom:60px;
}
.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- Top chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px;
  background:rgba(13,16,19,0.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--glass-border);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg, var(--teal), var(--amber));
  position:relative; overflow:hidden;
}
.brand .mark::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.55) 48%, transparent 65%);
  transform:translateX(-100%);
  animation:sheen 3.2s ease-in-out infinite;
}
@keyframes sheen{ 0%,20%{transform:translateX(-120%);} 55%,100%{transform:translateX(120%);} }
.brand .word{font-weight:700; font-size:15px; letter-spacing:0.06em;}
.brand .word span{color:var(--teal);}
.crumbs{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
.crumbs .sep{color:var(--text-dim); opacity:0.5;}
.crumbs .cur{color:var(--text-mid); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:8px;}
.chip-btn{
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:999px;
  background:var(--panel-2); border:1px solid var(--glass-border);
  color:var(--text-mid); font-size:12.5px; font-weight:600;
  cursor:pointer; transition:all .15s ease;
}
.chip-btn:hover{border-color:var(--glass-border-strong); color:var(--text-hi);}
.chip-btn.primary{background:var(--teal-dim); color:var(--teal); border-color:rgba(73,217,196,0.3);}

/* ---------- Stage ---------- */
.stage{
  max-width:1100px; margin:0 auto; padding:44px 24px 20px;
  display:flex; flex-direction:column; align-items:center; gap:16px;
}

/* Phone frame (customer) */
.phone-frame{
  width:380px; background:#05070a; border-radius:44px; padding:14px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 40px 80px -30px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.03);
}
.phone-screen{
  background:var(--bg-app); border-radius:32px; overflow:hidden;
  min-height:720px; position:relative; display:flex; flex-direction:column;
}
.notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:22px; background:#05070a; border-radius:0 0 16px 16px; z-index:5;
}

/* Desktop frame (staff/manager/landing) */
.desktop-frame{
  width:100%; max-width:980px; border-radius:16px; overflow:hidden;
  background:var(--bg-app); border:1px solid var(--glass-border);
  box-shadow:0 40px 80px -35px rgba(0,0,0,0.75);
}
.desktop-bar{
  display:flex; align-items:center; gap:6px; padding:10px 14px;
  background:var(--panel); border-bottom:1px solid var(--glass-border);
}
.desktop-bar .dot{width:9px; height:9px; border-radius:50%;}
.desktop-bar .dot:nth-child(1){background:#e5626a;}
.desktop-bar .dot:nth-child(2){background:#f0a93c;}
.desktop-bar .dot:nth-child(3){background:#49d9c4;}
.desktop-bar .url{
  margin-left:10px; font-size:11.5px; color:var(--text-dim);
  background:var(--panel-2); padding:4px 12px; border-radius:6px; flex:1; max-width:340px;
}
.desktop-body{min-height:600px; display:flex;}

.caption{
  max-width:520px; text-align:center; font-size:12.5px; color:var(--text-dim); line-height:1.5;
  padding:0 10px;
}
.caption b{color:var(--text-mid);}

/* ---------- Generic content styles ---------- */
.pad{padding:24px;}
h1.scr{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; letter-spacing:-0.01em;}
h2.scr{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600;}
.muted{color:var(--text-dim); font-size:12.5px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;}
.field input, .field select{
  width:100%; padding:12px 14px; border-radius:var(--radius-sm);
  background:var(--panel-2); border:1px solid var(--glass-border); color:var(--text-hi); font-size:13.5px;
  font-family:'Inter',sans-serif;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--teal);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:var(--radius-sm); border:none; cursor:pointer;
  font-size:13px; font-weight:700; font-family:'Inter',sans-serif; letter-spacing:0.01em;
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(135deg, var(--teal), #2fb8a4); color:#06231e; width:100%;}
.btn-amber{background:linear-gradient(135deg, var(--amber), #d98f22); color:#2b1a03;}
.btn-ghost{background:var(--panel-2); border:1px solid var(--glass-border); color:var(--text-hi);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:12px;}
.otp-row{display:flex; gap:8px; margin:20px 0;}
.otp-box{
  width:52px; height:58px; border-radius:10px; background:var(--panel-2);
  border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--teal);
}
.card{
  background:var(--panel); border:1px solid var(--glass-border); border-radius:var(--radius-md);
  padding:16px; margin-bottom:12px;
}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.tier-badge{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
  background:var(--amber-dim); color:var(--amber); font-size:11px; font-weight:700; letter-spacing:0.04em;
}
.balance-big{font-family:'JetBrains Mono',monospace; font-size:42px; font-weight:600; color:var(--teal); line-height:1;}
.nav-bottom{
  margin-top:auto; display:flex; border-top:1px solid var(--glass-border);
  background:var(--panel);
}
.nav-bottom .item{
  flex:1; text-align:center; padding:14px 6px; font-size:10.5px; color:var(--text-dim); font-weight:600;
  cursor:pointer;
}
.nav-bottom .item.active{color:var(--teal);}
.pill{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700;}
.pill.staff{background:var(--teal-dim); color:var(--teal);}
.pill.manager{background:var(--amber-dim); color:var(--amber);}

/* Desktop sidebar for staff */
.side{
  width:210px; background:var(--panel); border-right:1px solid var(--glass-border);
  padding:18px 14px; display:flex; flex-direction:column; gap:4px;
}
.side .item{
  padding:10px 12px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--text-mid);
  cursor:pointer; display:flex; align-items:center; gap:9px;
}
.side .item.active{background:var(--teal-dim); color:var(--teal);}
.side .item .ico{width:6px; height:6px; border-radius:2px; background:currentColor; opacity:0.6;}
.main-col{flex:1; padding:22px 26px; overflow:auto;}
.role-toggle{
  display:flex; gap:4px; background:var(--panel-2); padding:3px; border-radius:999px; border:1px solid var(--glass-border);
}
.role-toggle button{
  border:none; background:transparent; padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:700;
  color:var(--text-dim); cursor:pointer;
}
.role-toggle button.on{background:var(--teal); color:#06231e;}
.role-toggle button.on.manager{background:var(--amber); color:#2b1a03;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.stat-card{background:var(--panel); border:1px solid var(--glass-border); border-radius:var(--radius-md); padding:16px;}
.stat-card .num{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:600;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--text-dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--glass-border); text-transform:uppercase; font-size:10.5px; letter-spacing:0.05em;}
td{padding:10px; border-bottom:1px solid var(--glass-border);}
.landing-wrap{display:flex; gap:18px; padding:50px 40px; flex-wrap:wrap; justify-content:center;}
.portal-card{
  flex:1; min-width:280px; max-width:340px; background:var(--panel); border:1px solid var(--glass-border);
  border-radius:var(--radius-lg); padding:30px 24px; text-align:center; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
}
.portal-card:hover{transform:translateY(-4px); border-color:var(--teal);}
.portal-card .icon{
  width:56px; height:56px; margin:0 auto 18px; border-radius:16px;
  display:flex; align-items:center; justify-content:center; font-size:24px;
  background:var(--teal-dim);
}
.portal-card.manager .icon{background:var(--amber-dim);}
.portal-card.admin .icon{background:rgba(229,98,106,0.16);}

/* ---------- Sitemap overlay ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(6,8,10,0.88); backdrop-filter:blur(6px);
  z-index:100; display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:60px 20px;
}
.overlay.open{display:flex;}
.map-panel{width:100%; max-width:960px; background:var(--panel); border:1px solid var(--glass-border-strong); border-radius:20px; padding:30px;}
.map-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:20px;}

.map-col h3{font-family:'Space Grotesk',sans-serif; font-size:13px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.map-node{
  background:var(--panel-2); border:1px solid var(--glass-border); border-radius:10px;
  padding:10px 12px; font-size:12px; margin-bottom:8px; cursor:pointer; color:var(--text-mid);
}
.map-node:hover{border-color:var(--teal); color:var(--text-hi);}
.close-x{position:absolute; top:22px; right:26px; cursor:pointer; color:var(--text-dim); font-size:20px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark"></div>
    <div class="word">MAGMA <span>AUTOSPA</span></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div class="topbar-right">
    <button class="chip-btn" onclick="goHome()">↺ Restart</button>
    <button class="chip-btn primary" onclick="openMap()">⌗ Site map</button>
  </div>
</div>

<div class="stage" id="stage"></div>

<div class="overlay" id="mapOverlay">
  <div class="map-panel" style="position:relative;">
    <div class="close-x" onclick="closeMap()">✕</div>
    <h2 class="scr">Full clickthrough map</h2>
    <p class="muted" style="margin-top:6px;">Jump straight to any screen. Grouped by portal — this is the structure the client walkthrough follows.</p>
    <div class="map-cols">
      <div class="map-col">
        <h3><span style="color:var(--teal)">●</span> Staff portal (desktop)</h3>
        <div id="mapStaff"></div>
      </div>
      <div class="map-col">
        <h3><span style="color:var(--amber)">●</span> Manager portal (desktop)</h3>
        <div id="mapManager"></div>
      </div>
      <div class="map-col">
        <h3><span style="color:var(--danger)">●</span> Admin portal (hidden)</h3>
        <div id="mapAdmin"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- Screen registry ---------------- */
const SCREENS = {};
const HISTORY = [];
let currentRole = "guest"; // guest | staff | manager | admin — only ever set by a real login
let currentBranch = "Kunnamkulam"; // which branch Admin is currently drilled into
let staffBranch = "Kunnamkulam"; // which branch the logged-in Staff/Manager belongs to
function selectBranch(name){ currentBranch = name; }

function reg(id, group, label, builder){ SCREENS[id] = {group, label, builder}; }

function crumbTrail(){
  return HISTORY.map((id,i)=> (i===HISTORY.length-1)
    ? `<span class="cur">${SCREENS[id].label}</span>`
    : `${SCREENS[id].label}<span class="sep">/</span>`).join("");
}
function render(){
  document.getElementById('crumbs').innerHTML = crumbTrail();
  const id = HISTORY[HISTORY.length-1];
  const s = SCREENS[id];
  document.getElementById('stage').innerHTML = s.builder();
}
const ROLE_LEVEL = {guest:0, staff:1, manager:2, admin:3};
const SCREEN_LEVEL = {
  'staff-dashboard':1, 'staff-customer-profile':1, 'staff-new-customer':1, 'staff-transaction':1, 'staff-redemption':1,
  'manager-dashboard':2, 'manager-analytics':2, 'manager-staff':2,
  'admin-dashboard':3, 'admin-branch-new':3, 'admin-branch':3, 'admin-branch-employees':3, 'admin-branch-employee-form':3,
  'admin-branch-manager':3, 'admin-branch-manager-form':3, 'admin-branch-services':3, 'admin-branch-service-form':3,
  'admin-branch-offers':3, 'admin-branch-offer-form':3, 'admin-customers':3, 'admin-whatsapp-preview':3
};
function isAllowed(id){ const lvl = SCREEN_LEVEL[id]; return lvl===undefined ? true : ROLE_LEVEL[currentRole] >= lvl; }
function go(id){ if(!isAllowed(id)) id='access-denied'; HISTORY.push(id); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goHome(){ HISTORY.length = 0; HISTORY.push('entry'); render(); }
function goBack(){ if(HISTORY.length>1){ HISTORY.pop(); render(); } }
function setRole(r){ currentRole = r; render(); }
function openMap(){
  const groups = {staff:[], manager:[], admin:[]};
  Object.entries(SCREENS).forEach(([id,s])=>{ if(groups[s.group]) groups[s.group].push([id,s.label]); });
  document.getElementById('mapStaff').innerHTML = groups.staff.map(([id,l])=>`<div class="map-node" onclick="jumpTo('${id}')">${l}</div>`).join("");
  document.getElementById('mapManager').innerHTML = groups.manager.map(([id,l])=>`<div class="map-node" onclick="jumpTo('${id}')">${l}</div>`).join("");
  document.getElementById('mapAdmin').innerHTML = groups.admin.map(([id,l])=>`<div class="map-node" onclick="jumpTo('${id}')">${l}</div>`).join("");
  document.getElementById('mapOverlay').classList.add('open');
}
function closeMap(){ document.getElementById('mapOverlay').classList.remove('open'); }
function jumpTo(id){ closeMap(); HISTORY.length=0; HISTORY.push('entry'); if(id!=='entry') HISTORY.push(isAllowed(id)?id:'access-denied'); render(); }

function phoneFrame(inner){
  return `<div class="phone-frame"><div class="phone-screen"><div class="notch"></div>${inner}</div></div>`;
}
function desktopFrame(inner, url){
  return `<div class="desktop-frame">
    <div class="desktop-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url">${url}</div></div>
    <div class="desktop-body">${inner}</div>
  </div>`;
}
function backRow(){
  return HISTORY.length>1 ? `<div style="margin-bottom:12px;"><span class="muted" style="cursor:pointer" onclick="goBack()">← Back</span></div>` : '';
}

/* ============ ENTRY ============ */
reg('entry','hidden','Sign in', ()=>`
  ${desktopFrame(`
    <div style="width:100%;">
      <div class="landing-wrap" style="padding-top:64px;">
        <div class="portal-card" onclick="go('staff-login')">
          <div class="icon">🧰</div>
          <h2 class="scr">Staff</h2>
          <p class="muted" style="margin-top:8px;">Log in with your Staff ID to look up customers, log services, and process redemptions at billing.</p>
          <div class="btn btn-primary" style="margin-top:18px;">Log in as Staff</div>
        </div>
        <div class="portal-card manager" onclick="go('manager-login')">
          <div class="icon">🗝️</div>
          <h2 class="scr">Manager</h2>
          <p class="muted" style="margin-top:8px;">Log in with your Manager ID for everything staff can do, plus branch analytics and staff management.</p>
          <div class="btn btn-amber" style="margin-top:18px;">Log in as Manager</div>
        </div>
        <div class="portal-card admin" onclick="go('admin-login')">
          <div class="icon">🛡️</div>
          <h2 class="scr">Admin</h2>
          <p class="muted" style="margin-top:8px;">Log in with your Admin ID for full access across all branches — services, pricing, offers, and staff.</p>
          <div class="btn" style="background:var(--danger); color:#2b0d0f; margin-top:18px;">Log in as Admin</div>
        </div>
      </div>
    </div>
  `,'magma-autospa.in')}
  <p class="caption">This is an internal tool — there's no public or customer-facing side. Customers are served entirely in person; staff log their visit and redeem rewards right here at billing, and the customer gets their bill and points total by <b>WhatsApp</b> afterward. All three roles sign in from this same screen, each with their own ID and their own permissions.</p>
`);

/* ============ STAFF LOGIN ============ */
reg('staff-login','staff','Staff login', ()=>`
  ${desktopFrame(`
    <div class="main-col" style="max-width:380px; margin:60px auto;">
      ${backRow()}
      <span class="pill staff">Staff sign in</span>
      <h1 class="scr" style="margin-top:10px;">Welcome back</h1>
      <p class="muted" style="margin:6px 0 22px;">Select your branch to continue</p>
      <div class="field"><label>Branch</label>
        <select id="staffBranchSelect"><option>Kunnamkulam</option><option>Thrissur</option></select>
      </div>
      <div class="field"><label>Staff ID</label><input value="MAG-0142"></div>
      <div class="field"><label>Password</label><input type="password" value="••••••••"></div>
      <div class="btn btn-primary" onclick="const el=document.getElementById('staffBranchSelect'); staffBranch=el?el.value:'Kunnamkulam'; setRole('staff'); go('staff-dashboard')">Log in</div>
      <p class="muted" style="margin-top:14px;">Not a staff member? <span style="color:var(--amber); cursor:pointer;" onclick="go('manager-login')">Log in as Manager</span></p>
    </div>
  `,'magma-autospa.in/staff/login')}
  <p class="caption">Staff sign in with a <b>Staff ID</b> tied to one branch — every screen from here on shows that branch's name, so it's always clear whose numbers you're looking at.</p>
`);

/* ============ MANAGER LOGIN ============ */
reg('manager-login','manager','Manager login', ()=>`
  ${desktopFrame(`
    <div class="main-col" style="max-width:380px; margin:60px auto;">
      ${backRow()}
      <span class="pill manager">Manager sign in</span>
      <h1 class="scr" style="margin-top:10px;">Welcome back</h1>
      <p class="muted" style="margin:6px 0 22px;">Select your branch to continue</p>
      <div class="field"><label>Branch</label>
        <select id="managerBranchSelect"><option>Kunnamkulam</option><option>Thrissur</option></select>
      </div>
      <div class="field"><label>Manager ID</label><input value="MGR-0031"></div>
      <div class="field"><label>Password</label><input type="password" value="••••••••"></div>
      <div class="btn btn-amber" onclick="const el=document.getElementById('managerBranchSelect'); staffBranch=el?el.value:'Kunnamkulam'; setRole('manager'); go('staff-dashboard')">Log in</div>
      <p class="muted" style="margin-top:14px;">Not a manager? <span style="color:var(--teal); cursor:pointer;" onclick="go('staff-login')">Log in as Staff</span></p>
    </div>
  `,'magma-autospa.in/manager/login')}
  <p class="caption">Managers sign in with a separate <b>Manager ID</b>, tied to one branch — analytics and staff management always reflect that branch alone.</p>
`);

/* ============ STAFF/MANAGER DASHBOARD (role-aware) ============ */
function sideNav(active){
  const items = [
    ['staff-dashboard','⌂','Dashboard','both'],
    ['staff-customer-profile','⌕','Find customer','both'],
    ['staff-transaction','＋','New transaction','both'],
    ['staff-redemption','◈','Redemptions','both'],
    ['manager-analytics','▤','Branch analytics','manager'],
    ['manager-staff','◎','Manage staff','manager'],
  ];
  return items.filter(i=>i[3]==='both'||i[3]===currentRole).map(i=>
    `<div class="item ${i[0]===active?'active':''}" onclick="go('${i[0]}')"><span class="ico"></span>${i[2]}</div>`
  ).join('');
}
function roleToggleHTML(){
  if(currentRole==='admin') return `<span class="pill" style="background:rgba(229,98,106,0.16); color:var(--danger);">🛡️ Admin account</span>`;
  return currentRole==='manager'
    ? `<span class="pill manager">🗝️ Manager account</span>`
    : `<span class="pill staff">🧰 Staff account · Manager tools locked</span>`;
}

/* ============ ACCESS DENIED ============ */
reg('access-denied','hidden','Access restricted', ()=>`
  ${desktopFrame(`
    <div class="main-col" style="max-width:420px; margin:90px auto; text-align:center;">
      <div style="font-size:34px;">🔒</div>
      <h1 class="scr" style="margin-top:16px;">This area is locked</h1>
